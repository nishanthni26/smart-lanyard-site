    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://smartlanyard.in/#organization",
            "name": "Nexum",
            "url": "https://smartlanyard.in/",
            "description": "AI workers for recurring operations."
          },
          {
            "@type": "WebSite",
            "@id": "https://smartlanyard.in/#website",
            "url": "https://smartlanyard.in/",
            "name": "Nexum",
            "description": "Ship AI workers that grind while you rest.",
            "publisher": { "@id": "https://smartlanyard.in/#organization" },
            "inLanguage": "en"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const redirect = sessionStorage.getItem("smartLanyardRedirect");
        if (!redirect) return;
        sessionStorage.removeItem("smartLanyardRedirect");
        const target = new URL(redirect);
        window.history.replaceState(null, "", `${target.pathname}${target.search}${target.hash}`);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
