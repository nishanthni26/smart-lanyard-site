<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050914" />
    <meta name="description" content="Smart Lanyard connects identity, access, attendance, updates and safety in one flexible card experience for schools and workplaces." />
    <title>Smart Lanyard — One smart card. Unlimited possibilities.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;450;500;560;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const redirect = sessionStorage.getItem("smartLanyardRedirect");
        if (!redirect) return;
        sessionStorage.removeItem("smartLanyardRedirect");
        const target = new URL(redirect);
        window.history.replaceState(null, "", `${target.pathname}${target.search}${target.hash}`);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
