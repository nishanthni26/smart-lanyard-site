<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Smart Lanyard — Smart Identity. Real-Time Visibility.</title>
    <meta name="theme-color" content="#03060c" />
    <meta name="description" content="One smart lanyard for identity, access, safety and real-time visibility." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800;6..12,900&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        const redirect = sessionStorage.getItem("smartLanyardRedirect");
        if (!redirect) return;
        sessionStorage.removeItem("smartLanyardRedirect");
        const target = new URL(redirect);
        window.history.replaceState(null, "", `${target.pathname}${target.search}${target.hash}`);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
